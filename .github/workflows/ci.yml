name: CI

# Runs the same gates you run locally, on every push and pull request, so a
# regression turns the PR red instead of slipping through.
on:
  push:
  pull_request:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · lint · format · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13; a lower version only warns today but
          # is unsupported and may break on a future pnpm patch.
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml is out of sync with package.json.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  backend:
    name: Backend (cargo test · clippy)
    # Windows matches the target and exercises the Windows-only drive FFI;
    # WebView2 is already present, avoiding the Linux system-dependency dance.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cache the Cargo registry and build output so later runs are fast.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
